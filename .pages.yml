media:
  label: Bilder
  input: public/images
  output: /images
  rename: safe
  categories: [image]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "innhold: opprett {path}"
      update: "innhold: oppdater {path}"
      delete: "innhold: slett {path}"
      rename: "innhold: gi nytt navn til {oldPath}"

content:
  - name: sider
    label: Faste sider
    type: group
    items:
      - name: forside
        label: Forside
        type: file
        path: src/content/pages/home.json
        format: json
        operations:
          delete: false
        fields:
          - name: hero
            label: Toppfelt
            type: object
            required: true
            fields:
              - name: headingLead
                label: Overskrift – innledning
                type: string
                required: true
                description: "Teksten før det burgunderfargede ordet. Eksempel: Et."
                options:
                  maxlength: 40
              - name: headingBurgundy
                label: Overskrift – burgunder tekst
                type: string
                required: true
                description: Dette ordet eller uttrykket vises i burgunder.
                options:
                  maxlength: 40
              - name: headingMiddle
                label: Overskrift – midttekst
                type: string
                required: true
                description: Teksten mellom den burgunderfargede og gullfargede teksten.
                options:
                  maxlength: 80
              - name: headingGold
                label: Overskrift – gulltekst
                type: string
                required: true
                description: Dette ordet eller uttrykket vises i gull.
                options:
                  maxlength: 40
              - name: headingSuffix
                label: Overskrift – avslutning
                type: string
                required: true
                description: "Teksten rett etter gullteksten. Ta med bindestrek hvis den skal brukes."
                options:
                  maxlength: 60
              - name: description
                label: Introduksjon
                type: text
                required: true
                options:
                  minlength: 40
                  maxlength: 400
              - name: primaryButtonLabel
                label: Tekst på programknappen
                type: string
                required: true
                description: Knappen går alltid til Program.
                options:
                  maxlength: 30
              - name: secondaryButtonLabel
                label: Tekst på medlemsknappen
                type: string
                required: true
                description: Knappen går alltid til Bli medlem.
                options:
                  maxlength: 30
              - name: facts
                label: Faktalinje
                type: string
                required: true
                description: Kort faktalinje under knappene.
                options:
                  maxlength: 120

          - name: events
            label: Konsertseksjon
            type: object
            required: true
            fields:
              - name: badge
                label: Liten overskrift
                type: string
                required: true
                options:
                  maxlength: 60
              - name: heading
                label: Overskrift
                type: string
                required: true
                options:
                  maxlength: 80
              - name: itemLinkLabel
                label: Tekst på konsertlenker
                type: string
                required: true
                options:
                  maxlength: 30
              - name: allLinkLabel
                label: Tekst på «se alle»-lenken
                type: string
                required: true
                options:
                  maxlength: 40

          - name: news
            label: Nyhetsseksjon
            type: object
            required: true
            fields:
              - name: badge
                label: Liten overskrift
                type: string
                required: true
                options:
                  maxlength: 60
              - name: heading
                label: Overskrift
                type: string
                required: true
                options:
                  maxlength: 80
              - name: featuredLinkLabel
                label: Tekst på hovedsakens lenke
                type: string
                required: true
                options:
                  maxlength: 30
              - name: allLinkLabel
                label: Tekst på «se alle»-lenken
                type: string
                required: true
                options:
                  maxlength: 40

          - name: gallery
            label: Bildealbum
            type: object
            required: true
            fields:
              - name: badge
                label: Liten overskrift
                type: string
                required: true
                options:
                  maxlength: 60
              - name: heading
                label: Overskrift
                type: string
                required: true
                options:
                  maxlength: 80
              - name: allLinkLabel
                label: Tekst på lenken under bildene
                type: string
                required: true
                description: Lenken går alltid til Nyheter.
                options:
                  maxlength: 40
              - name: items
                label: Bilder
                type: object
                required: true
                list:
                  min: 5
                  max: 5
                  collapsible:
                    collapsed: true
                    summary: "{imageAlt}"
                description: Forsiden bruker alltid fem bilder. Rekkefølgen bestemmer plasseringen.
                fields:
                  - name: image
                    label: Bilde
                    type: image
                    required: true
                    options:
                      path: uploads/homepage
                      extensions: [jpg, jpeg, png, webp]
                      rename: safe
                  - name: imageAlt
                    label: Bildetekst for skjermleser
                    type: string
                    required: true
                    description: Beskriv kort hva som er synlig i bildet.
                    options:
                      minlength: 10
                      maxlength: 160

          - name: support
            label: Støtt oss-seksjon
            type: object
            required: true
            fields:
              - name: badge
                label: Liten overskrift
                type: string
                required: true
                options:
                  maxlength: 60
              - name: heading
                label: Overskrift
                type: string
                required: true
                options:
                  maxlength: 100
              - name: description
                label: Beskrivelse
                type: text
                required: true
                options:
                  minlength: 40
                  maxlength: 500
              - name: primaryButtonLabel
                label: Tekst på sponsorknappen
                type: string
                required: true
                description: Knappen går alltid til Støtt oss.
                options:
                  maxlength: 30
              - name: secondaryButtonLabel
                label: Tekst på «les mer»-knappen
                type: string
                required: true
                description: Knappen går alltid til Om oss.
                options:
                  maxlength: 30

  - name: redaksjonelt
    label: Redaksjonelt innhold
    type: group
    items:
      - name: konserter
        label: Konserter
        type: collection
        path: src/content/concerts
        format: json
        filename:
          template: "{id}.json"
          field: create
        view:
          primary: title
          fields: [title, date, status, published]
          search: [title, venue]
          sort: [date, title]
          default:
            sort: date
            order: desc
        fields:
          - name: id
            label: Kort ID
            type: string
            required: true
            description: "Bruk små bokstaver, tall og bindestrek. Eksempel: sommerkonsert-2026."
            pattern:
              regex: "^[a-z0-9-]+$"
              message: Bruk bare små bokstaver, tall og bindestrek.
          - name: title
            label: Konserttittel
            type: string
            required: true
            options:
              maxlength: 100
          - name: date
            label: Dato
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: time
            label: Klokkeslett
            type: string
            description: La feltet stå tomt hvis tidspunktet ikke er bestemt.
            pattern:
              regex: "^$|^([01]\\d|2[0-3]):[0-5]\\d$"
              message: Bruk formatet TT:MM, for eksempel 18:00.
          - name: venue
            label: Sted
            type: string
            required: true
          - name: address
            label: Adresse
            type: string
            required: true
          - name: description
            label: Beskrivelse
            type: text
            required: true
            options:
              minlength: 40
              maxlength: 600
          - name: status
            label: Status
            type: select
            required: true
            options:
              values:
                - name: bekreftet
                  label: Bekreftet og kommende
                - name: avholdt
                  label: Avholdt
                - name: annonseres
                  label: Annonseres senere
                - name: utkast
                  label: Utkast
          - name: published
            label: Publisert på nettsiden
            type: boolean
            required: true
            description: Slå av for å lagre et utkast som ikke vises offentlig.
          - name: image
            label: Konsertbilde
            type: image
            description: Liggende format anbefales.
            options:
              path: uploads/concerts
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: imageAlt
            label: Bildetekst for skjermleser
            type: string
            options:
              maxlength: 160
          - name: ticketPrice
            label: Billettpris
            type: string
            description: "Eksempel: 150 kr. La stå tomt ved gratis eller ukjent pris."
          - name: childrenFree
            label: Gratis for barn
            type: boolean
          - name: facebookEventUrl
            label: Lenke til Facebook-arrangement
            type: string
            pattern:
              regex: "^$|^https://.+$"
              message: Lenken må starte med https://
          - name: program
            label: Program
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: kind
                label: Type
                type: select
                required: true
                options:
                  values:
                    - name: korps
                      label: Korps
                    - name: verk
                      label: Verk
              - name: label
                label: Navn eller tittel
                type: string
                required: true
              - name: credit
                label: Dirigent eller komponist
                type: string

      - name: nyheter
        label: Nyheter
        type: collection
        path: src/content/news
        format: json
        filename:
          template: "{id}.json"
          field: create
        view:
          primary: title
          fields: [title, category, featured, published]
          search: [title, category, summary]
          sort: [sortOrder, title]
          default:
            sort: sortOrder
            order: asc
        fields:
          - name: id
            label: Kort ID
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9-]+$"
              message: Bruk bare små bokstaver, tall og bindestrek.
          - name: title
            label: Tittel
            type: string
            required: true
            options:
              maxlength: 120
          - name: category
            label: Kategori
            type: select
            required: true
            options:
              values: [Konkurranse, Konsert, Repertoar, Korpsliv]
          - name: summary
            label: Kort ingress
            type: text
            required: true
            options:
              minlength: 30
              maxlength: 320
          - name: image
            label: Bilde
            type: image
            required: true
            options:
              path: uploads/news
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: imageAlt
            label: Bildetekst for skjermleser
            type: string
            required: true
            options:
              minlength: 10
              maxlength: 160
          - name: featured
            label: Fremhevet på forsiden
            type: boolean
            required: true
            description: Bare én nyhet bør være fremhevet om gangen.
          - name: published
            label: Publisert på nettsiden
            type: boolean
            required: true
          - name: sortOrder
            label: Rekkefølge
            type: number
            required: true
            description: Laveste tall vises først.

      - name: medlemmer
        label: Medlemmer
        type: collection
        path: src/content/members
        format: json
        filename:
          template: "{id}.json"
          field: create
        view:
          primary: name
          fields: [name, role, section, published]
          search: [name, role, section]
          sort: [sortOrder, name]
          default:
            sort: sortOrder
            order: asc
        fields:
          - name: id
            label: Kort ID
            type: string
            required: true
            pattern:
              regex: "^[a-z0-9-]+$"
              message: Bruk bare små bokstaver, tall og bindestrek.
          - name: name
            label: Navn
            type: string
            required: true
            options:
              maxlength: 100
          - name: role
            label: Rolle eller instrument
            type: string
            required: true
            options:
              maxlength: 100
          - name: section
            label: Gruppe
            type: string
            required: true
            description: "Eksempel: Kornetter, Horn eller Kunstnerisk ledelse."
          - name: bio
            label: Kort presentasjon
            type: text
            options:
              maxlength: 320
          - name: image
            label: Portrett
            type: image
            description: Frivillig. Bruk et ryddig portrett i stående format.
            options:
              path: uploads/members
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: imageAlt
            label: Bildetekst for skjermleser
            type: string
            options:
              maxlength: 160
          - name: published
            label: Publisert på nettsiden
            type: boolean
            required: true
          - name: sortOrder
            label: Rekkefølge
            type: number
            required: true
            description: Laveste tall vises først.
